<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声のお知らせ｜豊田連合</title>
<meta name="description" content="豊田連合からのお知らせを、音声と文字でお届けします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2933;
  --indigo:#24405C;
  --indigo-deep:#1A2E43;
  --paper:#F2F3EF;
  --card:#FFFFFF;
  --seal:#B23A2B;
  --seal-soft:#F6E8E5;
  --bamboo:#4B7A4E;
  --bamboo-soft:#E7EFE6;
  --slate:#68736C;
  --line:#DCDFD8;

  --w-max:44rem;
  --r:10px;
  --font-display:"Shippori Mincho B1", serif;
  --font-body:"Zen Kaku Gothic New", system-ui, sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.75;
}

/* ---------- 掲示板の枠を模したヘッダー ---------- */
.board{
  background:var(--indigo);
  color:#fff;
  border-bottom:6px solid var(--indigo-deep);
}
.board-inner{
  max-width:var(--w-max);
  margin:0 auto;
  padding:2rem 1.25rem 1.75rem;
}
.eyebrow{
  margin:0 0 .35rem;
  font-size:.82rem;
  letter-spacing:.28em;
  color:#B9C6D4;
}
.board h1{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.9rem,6vw,2.5rem);
  letter-spacing:.06em;
  margin:0;
  line-height:1.3;
}
.lede{
  margin:.7rem 0 0;
  font-size:.95rem;
  color:#CFD9E2;
}

main{
  max-width:var(--w-max);
  margin:0 auto;
  padding:1.75rem 1.25rem 4rem;
}

.section-head{
  font-family:var(--font-display);
  font-size:1.05rem;
  font-weight:600;
  letter-spacing:.14em;
  color:var(--slate);
  margin:2.25rem 0 .9rem;
  padding-bottom:.5rem;
  border-bottom:1px solid var(--line);
}
.section-head:first-child{margin-top:0}

/* ---------- お知らせカード ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}

.item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:1.1rem 1.15rem;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:1rem;
  align-items:start;
}
.item.is-urgent{
  border-color:var(--seal);
  border-left-width:6px;
  background:#FFFCFB;
}

.item-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.55rem;
  font-size:.82rem;
  color:var(--slate);
  margin-bottom:.3rem;
}
.tag{
  font-weight:700;
  font-size:.75rem;
  letter-spacing:.08em;
  padding:.18rem .55rem;
  border-radius:3px;
}
.tag-urgent{background:var(--seal-soft);color:var(--seal)}
.tag-event{background:var(--bamboo-soft);color:var(--bamboo)}
.tag-info{background:#E9EDF2;color:var(--indigo)}
.dur{font-variant-numeric:tabular-nums}

.item h3{
  font-family:var(--font-display);
  font-size:1.16rem;
  font-weight:600;
  line-height:1.55;
  margin:0 0 .4rem;
}
.item p{margin:0;font-size:.95rem;color:#3C4750;white-space:pre-wrap}

/* ---------- 署名要素：押印のような再生ボタン ---------- */
.stamp{
  position:relative;
  width:64px;height:64px;
  flex:none;
  border:none;
  padding:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  color:var(--indigo);
}
.stamp svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.stamp .track{fill:none;stroke:var(--line);stroke-width:5}
.stamp .ring{
  fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:283;stroke-dashoffset:283;
  transition:stroke-dashoffset .2s linear;
}
.stamp .glyph{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-size:1.35rem;
  line-height:1;
}
.item.is-urgent .stamp{color:var(--seal)}
.item.is-event .stamp{color:var(--bamboo)}
.stamp:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.stamp[aria-pressed="true"] .glyph{font-size:1.1rem}
.done{
  font-size:.78rem;
  color:var(--slate);
  margin-top:.5rem;
  display:inline-block;
}

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r);
  padding:2.25rem 1.25rem;
  text-align:center;
  color:var(--slate);
}

.notice{
  margin:0 0 1.5rem;
  padding:.75rem 1rem;
  border-radius:6px;
  background:#FFF6E5;
  border:1px solid #E8D6AE;
  font-size:.86rem;
  color:#6B5426;
}

footer{
  border-top:1px solid var(--line);
  background:#EAEBE6;
}
.footer-inner{
  max-width:var(--w-max);
  margin:0 auto;
  padding:1.5rem 1.25rem 2.5rem;
  font-size:.84rem;
  color:var(--slate);
}
footer a{color:var(--indigo)}

@media (max-width:420px){
  .item{grid-template-columns:1fr;gap:.75rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<header class="board">
  <div class="board-inner">
    <p class="eyebrow">豊田連合</p>
    <h1>音声のお知らせ</h1>
    <p class="lede">地域のお知らせを声でお届けします。文字でもお読みいただけます。</p>
  </div>
</header>

<main>
  <p class="notice" id="demoNotice" hidden>
    これはデモ表示です。Firebase の設定を入れると、実際に登録したお知らせが並びます。デモの音声は無音です。
  </p>

  <section id="urgentSection" hidden>
    <h2 class="section-head">いま確認してください</h2>
    <ul class="list" id="urgentList"></ul>
  </section>

  <section>
    <h2 class="section-head" id="normalHead">最近のお知らせ</h2>
    <ul class="list" id="normalList"></ul>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <p>豊田連合町内会</p>
    <p>災害時の正式な情報は、横浜市および栄区からの発表・緊急速報メールをご確認ください。このページは地域からの補足のお知らせです。</p>
  </div>
</footer>

<script>
/* =========================================================
   1) Firebase の設定
   Firebase コンソール →「プロジェクトの設定」→「マイアプリ」からコピーして貼り付け。
   空のままだとデモモードで動きます。
   ========================================================= */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const CATEGORY = {
  urgent: { label: "緊急",     cls: "urgent" },
  event:  { label: "イベント", cls: "event"  },
  info:   { label: "お知らせ", cls: "info"   }
};

/* ---------- 共通の再生管理（同時に鳴るのは1つだけ） ---------- */
const audio = new Audio();
let currentCard = null;

function resetCard(card){
  if(!card) return;
  card.btn.setAttribute("aria-pressed","false");
  card.glyph.textContent = "▶";
  card.btn.setAttribute("aria-label", card.title + " を再生");
}

audio.addEventListener("timeupdate", () => {
  if(!currentCard || !audio.duration) return;
  const p = audio.currentTime / audio.duration;
  currentCard.ring.style.strokeDashoffset = String(283 * (1 - p));
});
audio.addEventListener("ended", () => {
  if(!currentCard) return;
  currentCard.ring.style.strokeDashoffset = "0";
  currentCard.done.hidden = false;
  resetCard(currentCard);
  currentCard = null;
});

function toggle(card){
  if(currentCard === card){
    if(audio.paused){ audio.play(); card.glyph.textContent = "❚❚"; card.btn.setAttribute("aria-pressed","true"); }
    else { audio.pause(); card.glyph.textContent = "▶"; card.btn.setAttribute("aria-pressed","false"); }
    return;
  }
  if(currentCard){
    audio.pause();
    currentCard.ring.style.strokeDashoffset = "283";
    resetCard(currentCard);
  }
  currentCard = card;
  audio.src = card.url;
  audio.play().catch(() => {
    alert("音声を再生できませんでした。通信環境をご確認ください。");
  });
  card.glyph.textContent = "❚❚";
  card.btn.setAttribute("aria-pressed","true");
  card.btn.setAttribute("aria-label", card.title + " を一時停止");
}

/* ---------- 表示 ---------- */
function fmtDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDur(sec){
  if(!sec) return "";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m ? `${m}分${s}秒` : `${s}秒`;
}

function render(item){
  const cat = CATEGORY[item.category] || CATEGORY.info;

  const li = document.createElement("li");
  li.className = "item is-" + cat.cls;

  const btn = document.createElement("button");
  btn.className = "stamp";
  btn.type = "button";
  btn.setAttribute("aria-pressed","false");
  btn.innerHTML =
    '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle class="track" cx="50" cy="50" r="45"></circle>' +
      '<circle class="ring"  cx="50" cy="50" r="45"></circle>' +
    '</svg>' +
    '<span class="glyph" aria-hidden="true">▶</span>';

  const body = document.createElement("div");
  body.innerHTML =
    '<div class="item-meta">' +
      `<span class="tag tag-${cat.cls}">${cat.label}</span>` +
      `<time datetime="${item.publishedAt.toISOString()}">${fmtDate(item.publishedAt)}</time>` +
      (item.durationSec ? `<span class="dur">${fmtDur(item.durationSec)}</span>` : "") +
    '</div>';

  const h3 = document.createElement("h3");
  h3.textContent = item.title;
  const p = document.createElement("p");
  p.textContent = item.body || "";
  const done = document.createElement("span");
  done.className = "done";
  done.textContent = "聞き終わりました";
  done.hidden = true;

  body.append(h3, p, done);
  li.append(btn, body);

  const card = {
    btn, done, title: item.title, url: item.audioUrl,
    ring: btn.querySelector(".ring"),
    glyph: btn.querySelector(".glyph")
  };
  btn.setAttribute("aria-label", item.title + " を再生");
  btn.addEventListener("click", () => toggle(card));

  return li;
}

function paint(items){
  const urgent = items.filter(i => i.category === "urgent");
  const normal = items.filter(i => i.category !== "urgent");

  const uSec = document.getElementById("urgentSection");
  const uList = document.getElementById("urgentList");
  uList.innerHTML = "";
  urgent.forEach(i => uList.append(render(i)));
  uSec.hidden = urgent.length === 0;

  const nList = document.getElementById("normalList");
  nList.innerHTML = "";
  if(normal.length === 0){
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "いまお知らせはありません。";
    nList.append(li);
  } else {
    normal.forEach(i => nList.append(render(i)));
  }
}

/* ---------- デモ用の無音ファイル ---------- */
function silentWav(seconds){
  const sr = 8000, n = sr * seconds;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36 + n*2, true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,"data"); v.setUint32(40, n*2, true);
  return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
}

function demoData(){
  return [
    {
      category:"urgent",
      title:"大雨警報にともなう集会所の開放について",
      body:"本日15時に大雨警報が発表されました。豊田地区センターを一時滞在場所として開放しています。避難の要否は、横浜市の発表と緊急速報メールをご確認ください。",
      publishedAt:new Date(),
      durationSec:45,
      audioUrl:silentWav(45)
    },
    {
      category:"event",
      title:"夏まつりの準備、8月2日に集合します",
      body:"8月2日（日）朝9時から、会館前でテント設営を行います。動きやすい服装でお越しください。飲み物はこちらで用意します。",
      publishedAt:new Date(Date.now() - 864e5 * 2),
      durationSec:72,
      audioUrl:silentWav(20)
    },
    {
      category:"info",
      title:"資源回収の日程が変わります",
      body:"9月から、資源回収を第2・第4水曜日に変更します。カレンダーは各戸に配布します。",
      publishedAt:new Date(Date.now() - 864e5 * 6),
      durationSec:38,
      audioUrl:silentWav(15)
    }
  ];
}

/* ---------- 起動 ---------- */
(async function start(){
  if(!firebaseConfig.projectId){
    document.getElementById("demoNotice").hidden = false;
    paint(demoData());
    return;
  }

  try{
    const { initializeApp } = await import(SDK + "firebase-app.js");
    const { getFirestore, collection, query, where, orderBy, limit, getDocs }
      = await import(SDK + "firebase-firestore.js");

    const db = getFirestore(initializeApp(firebaseConfig));
    const q = query(
      collection(db, "broadcasts"),
      where("published", "==", true),
      orderBy("publishedAt", "desc"),
      limit(30)
    );
    const snap = await getDocs(q);

    const now = Date.now();
    const items = snap.docs.map(d => {
      const x = d.data();
      return {
        category: x.category,
        title: x.title,
        body: x.body,
        publishedAt: x.publishedAt.toDate(),
        expiresAt: x.expiresAt ? x.expiresAt.toDate() : null,
        durationSec: x.durationSec,
        audioUrl: x.audioUrl
      };
    }).filter(i => !i.expiresAt || i.expiresAt.getTime() > now);

    paint(items);
  }catch(err){
    console.error(err);
    document.getElementById("normalList").innerHTML =
      '<li class="empty">お知らせを読み込めませんでした。通信環境をご確認のうえ、ページを再読み込みしてください。</li>';
  }
})();
</script>
</body>
</html>
